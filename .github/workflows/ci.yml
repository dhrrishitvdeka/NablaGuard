name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy nablaguard
      - run: pytest --cov=nablaguard --cov-report=term-missing --junitxml=pytest-results.xml
      - run: python benchmarks/suite.py --quick --output nablaguard-benchmark.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidence-python-${{ matrix.python-version }}
          path: |
            pytest-results.xml
            nablaguard-benchmark.json
