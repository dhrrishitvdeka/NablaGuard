[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "nablaguard"
version = "0.6.0"
description = "Verification and debugging for differentiable PyTorch programs."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "NablaGuard contributors" }]
keywords = ["pytorch", "autograd", "gradients", "numerical-verification"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["numpy>=1.26", "torch>=2.2"]

[project.optional-dependencies]
dev = [
  "mypy>=1.10",
  "pre-commit>=3.7",
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "ruff>=0.5",
]

[project.scripts]
nabla = "nablaguard.cli.main:main"

[project.urls]
Homepage = "https://github.com/dhrrishitvdeka/NablaGuard"
Repository = "https://github.com/dhrrishitvdeka/NablaGuard"
Issues = "https://github.com/dhrrishitvdeka/NablaGuard/issues"

[tool.hatch.build.targets.wheel]
packages = ["nablaguard"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["nablaguard"]
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = "torch.*"
ignore_missing_imports = true
follow_imports = "skip"

[[tool.mypy.overrides]]
module = ["numpy", "numpy.*"]
follow_imports = "skip"
